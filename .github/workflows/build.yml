name: Build Deploy
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Deployment branch
        required: true
        type: choice
        default: develop
        options:
          - develop
          - stage
          - main
      region:
        description: Deployment region
        required: true
        type: choice
        default: hillsboro
        options:
          - hillsboro
          - ashburn
      operation:
        description: Operation to run
        required: true
        type: choice
        default: build-deploy
        options:
          - build-deploy
          - route-blue
          - route-green
          - delete-blue
          - delete-green
  repository_dispatch:
    types: [pap-build-deploy]

env:
  SLACK_CHANNEL: xap-slack-notifications

jobs:
  sarguna:
    name: runnertesting
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted 
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Resolve values from branch and region
        shell: bash
        run: |
          set -euo pipefail
