name: Build Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Deployment branch
        required: true
        type: choice
        default: develop
        options:
          - develop
          - stage
          - main
      region:
        description: Deployment region
        required: true
        type: choice
        default: hillsboro
        options:
          - hillsboro
          - ashburn
      tag:
        description: Optional release tag (example: v1.2.3). Use only with branch=main. #if you provide a tag then branch must be main.
        required: false
        type: string
        default: ''
      operation:
        description: Operation to run
        required: true
        type: choice
        default: build-deploy
        options:
          - build-deploy
          - route-blue
          - route-green
          - delete-blue
          - delete-green
  repository_dispatch:
    types: [pap-build-deploy]
