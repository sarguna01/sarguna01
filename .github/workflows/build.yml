name: Build Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Deployment branch
        required: true
        type: choice
        default: develop
        options:
          - develop
          - stage
          - main
      region:
        description: Deployment region
        required: true
        type: choice
        default: hillsboro
        options:
          - hillsboro
          - ashburn
      operation:
        description: Operation to run
        required: true
        type: choice
        default: build-deploy
        options:
          - build-deploy
          - route-blue
          - route-green
          - delete-blue
          - delete-green
  repository_dispatch:
    types: [pap-build-deploy]

env:
  SLACK_CHANNEL: xap-slack-notifications

jobs:
  sarguna:
    name: runnertesting
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-deploy')    
    runs-on: self-hosted
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Resolve values from branch and region
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ inputs.branch }}"
          REGION_INPUT="${{ inputs.region }}"

          if [[ "$BRANCH" == "develop" && "$REGION_INPUT" == "hillsboro" ]]; then
            ENVIRONMENT="dev"
            CRED_ENV="stg"
            RDEI_ENVIRONMENT="dev"
            REGION="hillsboro"
            RDEI_SERVER="https://hillsboro"
            CLUSTER="hillsboro-dev"
          elif [[ "$BRANCH" == "develop" && "$REGION_INPUT" == "ashburn" ]]; then
            ENVIRONMENT="dev"
            CRED_ENV="dev"
            RDEI_ENVIRONMENT="-dev"
            REGION="ashburn"
            RDEI_SERVER="https://ashburn"
            CLUSTER="ashburn-dev"
          elif [[ "$BRANCH" == "stage" && "$REGION_INPUT" == "hillsboro" ]]; then
            ENVIRONMENT="dev"
            CRED_ENV="stg"
            RDEI_ENVIRONMENT="dev"
            REGION="hillsboro"
            RDEI_SERVER="https://hillsboro"
            CLUSTER="hillsboro-dev"
          elif [[ "$BRANCH" == "stage" && "$REGION_INPUT" == "ashburn" ]]; then
            ENVIRONMENT="stg"
            CRED_ENV="stg"
            RDEI_ENVIRONMENT="stg"
            REGION="ashburn"
            RDEI_SERVER="https://ashburn"
            CLUSTER="ashburn-dev-stg"
          elif [[ "$BRANCH" == "main" && "$REGION_INPUT" == "hillsboro" ]]; then
            ENVIRONMENT="prod"
            CRED_ENV="prod"
            RDEI_ENVIRONMENT="prod"
            REGION="hillsboro"
            RDEI_SERVER="https://hillsboro"
            CLUSTER="hillsboro-prod"
          elif [[ "$BRANCH" == "main" && "$REGION_INPUT" == "ashburn" ]]; then
            ENVIRONMENT="prod"
            CRED_ENV="prod"
            RDEI_ENVIRONMENT="prod"
            REGION="ashburn"
            RDEI_SERVER="https://ashburn"
            CLUSTER="ashburn-dev-stg"
          else
            echo "Unsupported branch/region combination: $BRANCH / $REGION_INPUT"
            echo "Allowed combinations:"
            echo "  develop + hillsboro|ashburn"
            echo "  stage + hillsboro|ashburn"
            echo "  main + hillsboro|ashburn"
            exit 1
          fi

          echo "PIPELINE_NAME=$PIPELINE_NAME" >> "$GITHUB_ENV"
          echo "CLUSTER=$CLUSTER" >> "$GITHUB_ENV"
          echo "REGION=$REGION" >> "$GITHUB_ENV"
          echo "RDEI_SERVER=$RDEI_SERVER" >> "$GITHUB_ENV"
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "CRED_ENV=$CRED_ENV" >> "$GITHUB_ENV"
          echo "RDEI_ENVIRONMENT=$RDEI_ENVIRONMENT" >> "$GITHUB_ENV"
          echo "PDP_REPO=$PDP_REPO" >> "$GITHUB_ENV"
          echo "RDEI_NAMESPACE=$RDEI_NAMESPACE" >> "$GITHUB_ENV"
          echo "GSLB_DNS=$GSLB_DNS" >> "$GITHUB_ENV"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}      
      
      - name: Setup Java 17  
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Build jar
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p nginx src/main/resources
          ./mvnw -Pprod clean verify

          
      - name: Run deploy with auto-selected values
        shell: bash
        run: |
          set -euo pipefail
          echo "branch=${{ inputs.branch }}"
          echo "region=${{ inputs.region }}"
          echo "environment=$ENVIRONMENT"
          echo "pipeline_name=$PIPELINE_NAME"
          echo "cluster=$CLUSTER"
          make create-pap-build-deploy \
            PIPELINE_NAME="$PIPELINE_NAME" \
            CLUSTER="$CLUSTER" \
            ENVIRONMENT="$ENVIRONMENT" \
            CRED_ENV="$CRED_ENV" \
            RDEI_ENVIRONMENT="$RDEI_ENVIRONMENT" \
            GITHUB_BRANCH="${{ inputs.branch }}" \
            IS_CCP_F5_BIGIP="$IS_CCP_F5_BIGIP" \
            PDP_REPO="$PDP_REPO" \
            RDEI_NAMESPACE="$RDEI_NAMESPACE" \
            REGION="$REGION" \
            GSLB_DNS="$GSLB_DNS" \
            RDEI_SERVER="$RDEI_SERVER"

      - name: Slack success notification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "{\"channel\":\"${SLACK_CHANNEL}\",\"text\":\"Build deploy succeeded for branch ${{ inputs.branch }} in region ${{ inputs.region }}. Pipeline: ${PIPELINE_NAME}.\"}"

      - name: Slack failure notification
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "{\"channel\":\"${SLACK_CHANNEL}\",\"text\":\"Build deploy failed for branch ${{ inputs.branch }} in region ${{ inputs.region }}. Run: ${GITHUB_RUN_ID}.\"}"
